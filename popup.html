<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Streaming Goblin</title>
  <style>
    @font-face {
      font-family: 'Rubik Iso';
      src: url(fonts/RubikIso-latin.woff2) format('woff2');
      font-display: block;
    }

    :root {
      --yellow: #ffea4f;
      --black: #000;
    }

    * { box-sizing: border-box; }

    body {
      width: 420px;
      margin: 0;
      padding: 18px 28px 14px;
      background: var(--black);
      color: var(--yellow);
      font-family: 'Rubik Iso', system-ui, sans-serif;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .goblin {
      position: absolute;
      top: 14px;
      left: 8px;
      width: 150px;
      pointer-events: none;
      transition: filter .25s, opacity .25s;
    }
    body.off .goblin { filter: grayscale(1); opacity: .45; }

    h1 {
      margin: 36px 0 0 136px;
      font-size: 20px;
      font-weight: 400;
      text-align: center;
      width: 214px;
    }

    #toggle {
      position: relative; /* sopra il goblin */
      display: block;
      width: 250px;
      height: 92px;
      margin: 12px 0 0 80px;
      background: var(--black);
      color: var(--yellow);
      border: 1px solid var(--yellow);
      font-family: inherit;
      font-size: 54px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    #toggle:hover,
    #toggle:focus-visible { background: var(--yellow); color: var(--black); outline: none; }

    h2 {
      margin: 38px -14px 12px;
      font-size: 28px;
      font-weight: 400;
      text-align: center;
    }

    #domain {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 0;
      background: var(--yellow);
      color: var(--black);
      font: 400 17px/1 Roboto, system-ui, sans-serif;
      text-align: center;
      outline: none;
    }
    #domain:focus { box-shadow: 0 0 0 2px var(--black), 0 0 0 3px var(--yellow); }

    .next-row {
      display: flex;
      gap: 8px;
      height: 44px;
    }
    #autonext {
      width: 96px;
      flex: none;
      background: var(--black);
      color: var(--yellow);
      border: 1px solid var(--yellow);
      font-family: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    #autonext.on { background: var(--yellow); color: var(--black); }
    #autonext:focus-visible { outline: 1px solid var(--yellow); outline-offset: 2px; }
    #next-value, #next-unit {
      min-width: 0;
      border: 0;
      border-radius: 0;
      background: var(--yellow);
      color: var(--black);
      font: 400 17px/1 Roboto, system-ui, sans-serif;
      text-align: center;
      outline: none;
      transition: opacity .15s;
    }
    #next-value { flex: 1; -moz-appearance: textfield; }
    #next-value::-webkit-inner-spin-button { opacity: 1; }
    #next-unit { flex: 1.4; cursor: pointer; padding: 0 8px; }
    #next-value:focus, #next-unit:focus { box-shadow: 0 0 0 2px var(--black), 0 0 0 3px var(--yellow); }
    .next-row.disabled #next-value,
    .next-row.disabled #next-unit { opacity: .35; }
    .hint {
      margin-top: 8px;
      font: 12px system-ui, sans-serif;
      text-align: center;
      opacity: .8;
    }

    #status {
      min-height: 16px;
      margin-top: 8px;
      font: 12px system-ui, sans-serif;
      text-align: center;
      opacity: .8;
    }
  </style>
</head>
<body>
  <img class="goblin" src="goblin.png" alt="">

  <h1>Streaming Goblin</h1>

  <button id="toggle">START</button>

  <h2>Update Domain</h2>

  <input id="domain" type="text" spellcheck="false" placeholder="streamingcommunityz.photos">

  <h2>Next Episode</h2>

  <div class="next-row" id="next-row">
    <button id="autonext" title="Play the next episode automatically">ON</button>
    <input id="next-value" type="number" min="0" step="1" aria-label="How much before the end">
    <select id="next-unit" aria-label="Unit">
      <option value="s">seconds</option>
      <option value="%">% of video</option>
    </select>
  </div>
  <div class="hint">How long before the end to start a 5s countdown to the next episode</div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
