<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Streaming Goblin</title>
  <style>
    @font-face {
      font-family: 'Rubik Iso';
      src: url(fonts/RubikIso-latin.woff2) format('woff2');
      font-display: block;
    }

    :root {
      --yellow: #ffea4f;
      --black: #000;
    }

    * { box-sizing: border-box; }

    body {
      width: 420px;
      margin: 0;
      padding: 18px 28px 10px;
      background: var(--black);
      color: var(--yellow);
      font-family: 'Rubik Iso', system-ui, sans-serif;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .goblin {
      position: absolute;
      top: 14px;
      left: 8px;
      width: 150px;
      pointer-events: none;
      transition: filter .25s, opacity .25s;
    }
    body.off .goblin { filter: grayscale(1); opacity: .45; }

    h1 {
      margin: 20px 0 0 136px;
      font-size: 20px;
      font-weight: 400;
      text-align: center;
      width: 214px;
    }

    #toggle {
      position: relative; /* sopra il goblin */
      display: block;
      width: 250px;
      height: 70px;
      margin: 10px 0 0 80px;
      background: var(--black);
      color: var(--yellow);
      border: 1px solid var(--yellow);
      font-family: inherit;
      font-size: 46px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    #toggle:hover,
    #toggle:focus-visible { background: var(--yellow); color: var(--black); outline: none; }

    h2 {
      margin: 16px -14px 8px;
      font-size: 22px;
      font-weight: 400;
      text-align: center;
    }

    #domain {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 0;
      background: var(--yellow);
      color: var(--black);
      font: 400 17px/1 Roboto, system-ui, sans-serif;
      text-align: center;
      outline: none;
    }
    #domain:focus { box-shadow: 0 0 0 2px var(--black), 0 0 0 3px var(--yellow); }

    .next-row {
      display: flex;
      gap: 8px;
      height: 44px;
    }
    .toggle {
      width: 80px;
      flex: none;
      background: var(--black);
      color: var(--yellow);
      border: 1px solid var(--yellow);
      font-family: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .toggle.on { background: var(--yellow); color: var(--black); }
    .toggle:disabled { opacity: .35; cursor: default; }
    .toggle:focus-visible { outline: 1px solid var(--yellow); outline-offset: 2px; }
    .field {
      min-width: 0;
      border: 0;
      border-radius: 0;
      background: var(--yellow);
      color: var(--black);
      font: 400 17px/1 Roboto, system-ui, sans-serif;
      text-align: center;
      outline: none;
      transition: opacity .15s;
    }
    #next-value { flex: 1; -moz-appearance: textfield; }
    #next-value::-webkit-inner-spin-button { opacity: 1; }
    #next-unit { flex: 1.4; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    #tracks-audio, #tracks-subs { flex: 1; cursor: pointer; padding: 0 4px; font-size: 14px; }
    .time { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .time span { font-size: 13px; opacity: .7; }
    .time input {
      width: 58px; border: 0; background: none; color: inherit; outline: none;
      font: 400 17px/1 Roboto, system-ui, sans-serif; text-align: left;
    }
    .time:focus-within { box-shadow: 0 0 0 2px var(--black), 0 0 0 3px var(--yellow); }
    .next-row.disabled .time { opacity: .35; }
    .field:disabled { cursor: default; }
    input.field:focus, select.field:focus {
      box-shadow: 0 0 0 2px var(--black), 0 0 0 3px var(--yellow);
    }
    .next-row.disabled select,
    .next-row.disabled input { opacity: .35; }
    .hint {
      margin-top: 6px;
      font: 12px system-ui, sans-serif;
      text-align: center;
      opacity: .8;
    }

    #clear-history {
      display: block;
      margin: 12px auto 0;
      background: none;
      border: 0;
      color: var(--yellow);
      font: 12px system-ui, sans-serif;
      text-decoration: underline;
      opacity: .7;
      cursor: pointer;
    }
    #clear-history:hover { opacity: 1; }
    #clear-history[hidden] { display: none; }

    #status {
      margin-top: 6px;
      font: 12px system-ui, sans-serif;
      text-align: center;
      opacity: .8;
    }
  </style>
</head>
<body>
  <img class="goblin" src="goblin.png" alt="">

  <h1>Streaming Goblin</h1>

  <button id="toggle">START</button>

  <h2>Update Domain</h2>

  <input id="domain" type="text" spellcheck="false" placeholder="streamingcommunityz.photos">

  <h2>Next Episode</h2>

  <div class="next-row" id="next-row">
    <button id="autonext" class="toggle" title="Play the next episode automatically">ON</button>
    <input id="next-value" class="field" type="number" min="0" step="1" aria-label="Seconds before the end">
    <span id="next-unit" class="field">sec before end</span>
  </div>

  <h2>Language</h2>

  <div class="next-row" id="tracks-row">
    <button id="tracks" class="toggle" title="Set audio and subtitles automatically">OFF</button>
    <select id="tracks-audio" class="field" aria-label="Audio">
      <option value="ita">Audio: Italian</option>
      <option value="eng">Audio: English</option>
    </select>
    <select id="tracks-subs" class="field" aria-label="Subtitles">
      <option value="off">Subs: Off</option>
      <option value="forced-ita">Subs: Forced IT</option>
      <option value="ita">Subs: Italian</option>
      <option value="eng">Subs: English</option>
      <option value="eng-cc">Subs: English CC</option>
    </select>
  </div>

  <h2>Skip Intro</h2>

  <div class="next-row disabled" id="intro-row">
    <button id="intro" class="toggle" title="Skip the intro automatically">OFF</button>
    <label class="field time"><span>from</span>
      <input id="intro-start" type="text" inputmode="numeric" spellcheck="false"
             placeholder="0:45" aria-label="Intro start (minutes:seconds)"></label>
    <label class="field time"><span>to</span>
      <input id="intro-end" type="text" inputmode="numeric" spellcheck="false"
             placeholder="1:30" aria-label="Intro end (minutes:seconds)"></label>
  </div>
  <div class="hint">Applies to every episode: update it when you switch series</div>

  <button id="clear-history" hidden>Clear "Continue watching" history</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
